<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The studio's PATH map, shrunk to a tab: the model at the centre, the orbit
       around it, and the camera somewhere on it. Colours are the theme tokens
       written out, because an icon is served without the stylesheet. -->
